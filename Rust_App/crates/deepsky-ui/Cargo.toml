[package]
name = "deepsky-ui"
version = "0.1.0"
edition = "2021"
description = "DeepskyEyes desktop UI main crate, GPUI isolated (README §22-23, §64-68)"

[lib]
name = "deepsky_ui"
path = "src/lib.rs"

[dependencies]
deepsky-camera = { path = "../deepsky-camera" }
deepsky-sequencer = { path = "../deepsky-sequencer" }
deepsky-preview = { path = "../deepsky-preview" }
deepsky-session = { path = "../deepsky-session" }
deepsky-diagnostics = { path = "../deepsky-diagnostics" }
deepsky-metadata = { path = "../deepsky-metadata" }
gpui = { version = "=0.2.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
default = []
desktop = ["dep:gpui", "dep:windows"]
