[workspace]
resolver = "2"
members = [
    "crates/deepsky-protocol",
    "crates/deepsky-transport",
    "crates/deepsky-camera",
    "crates/deepsky-acquisition",
    "crates/deepsky-sequencer",
    "crates/deepsky-preview",
    "crates/deepsky-raw",
    "crates/deepsky-metadata",
    "crates/deepsky-session",
    "crates/deepsky-diagnostics",
    "crates/deepsky-testkit",
    "crates/deepsky-ui",
    "crates/deepsky-app",
    "crates/deepsky-cli",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

